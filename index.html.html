<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimoire Lunaire — Pages animées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#392b36;--plum:#62466b;--gold:#987650}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#42344b 0%,#1b1724 55%,#0d0b13 100%);font-family:'Dosis','Trebuchet MS',sans-serif;font-weight:600;color:var(--ink)}
.stage{width:min(96vw,1200px);height:min(92vh,800px);display:grid;place-items:center;perspective:1900px}
.book{position:relative;width:100%;height:min(66vw,670px);min-height:390px;max-height:78vh;display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 30px 25px rgba(0,0,0,.55));transform:rotateX(2deg) rotateY(-2deg);isolation:isolate}
.book:before{content:"";position:absolute;inset:8px -9px -13px 9px;z-index:-2;border-radius:10px 16px 16px 10px;background:repeating-linear-gradient(0deg,#9c805c 0 1px,#d0b98e 1px 3px,#ad936d 3px 4px);box-shadow:0 8px 14px #09070d}
.cover{position:absolute;inset:-15px -17px -17px -15px;z-index:-3;border-radius:12px 17px 17px 12px;background:linear-gradient(110deg,#24182a,#503955 48%,#261a2c);border:2px solid #8a6d8d;box-shadow:inset 0 0 0 5px #302139,inset 0 0 0 7px #a18491}
.cover:after{content:"";position:absolute;inset:13px;border:1px solid rgba(219,191,157,.5);border-radius:7px}
.page{position:relative;overflow:hidden;padding:7% 8%;background:
 radial-gradient(ellipse at 4% 4%,rgba(104,65,39,.26),transparent 24%),
 radial-gradient(ellipse at 96% 8%,rgba(118,75,44,.18),transparent 20%),
 radial-gradient(ellipse at 0 100%,rgba(99,57,33,.22),transparent 26%),
 radial-gradient(ellipse at 100% 100%,rgba(99,57,33,.2),transparent 23%),
 radial-gradient(ellipse at 48% 52%,rgba(255,249,224,.34),transparent 62%),
 repeating-linear-gradient(3deg,rgba(92,63,37,.035) 0 1px,transparent 1px 4px),
 linear-gradient(100deg,#d9c49b,#f0e2c1 18%,#ead8b2 80%,#d2bb8e);
 box-shadow:inset 0 0 34px rgba(82,52,29,.27),inset 0 0 4px rgba(68,43,27,.7)}
.page.left{border-radius:9px 2px 2px 9px;border-right:1px solid rgba(80,52,36,.3)}
.page.right{border-radius:2px 9px 9px 2px;border-left:1px solid rgba(80,52,36,.28)}
.page:before{content:"";position:absolute;inset:13px;border:1px solid rgba(105,74,49,.24);border-radius:3px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);pointer-events:none}
.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(105,69,40,.12),transparent 8%,transparent 92%,rgba(105,69,40,.12));opacity:.75}
.spine{position:absolute;z-index:8;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(54,35,30,.32),rgba(255,245,220,.42) 35%,rgba(70,45,38,.32) 70%,rgba(255,255,255,.16));box-shadow:0 0 15px rgba(53,34,27,.35);pointer-events:none}
.eyebrow,.kicker{text-align:center;text-transform:uppercase;letter-spacing:.22em;color:#765f66;font-size:clamp(10px,1.2vw,14px)}
h1,h2,p{position:relative;z-index:1}
h1{font-size:clamp(36px,5.5vw,68px);line-height:.94;letter-spacing:.04em;text-align:center;color:#49344d;margin:12px 0 8px;text-shadow:0 1px rgba(255,255,255,.45)}
.subtitle{text-align:center;font-size:clamp(15px,1.8vw,22px);letter-spacing:.08em;color:#755b68;margin:0}
.seal{width:clamp(110px,17vw,185px);aspect-ratio:1;margin:19px auto 12px;display:grid;place-items:center;position:relative}
.seal:before,.seal:after{content:"";position:absolute;border:1px solid rgba(91,62,89,.62);border-radius:50%;inset:4%}.seal:after{inset:13%;border-style:dashed}
.crescent{font-size:clamp(72px,9vw,108px);line-height:1;color:#72547b;text-shadow:2px 2px 0 rgba(255,255,255,.35)}
.rule{height:1px;width:54%;margin:17px auto;background:linear-gradient(90deg,transparent,#92765e,transparent)}
.motto{text-align:center;font-size:clamp(16px,1.7vw,21px);line-height:1.5;color:#5d4654;max-width:82%;margin:0 auto}
.corner{position:absolute;color:#80657b;font-size:23px;opacity:.76;z-index:1}.c1{top:22px;left:25px}.c2{top:22px;right:25px}.c3{bottom:22px;left:25px}.c4{bottom:22px;right:25px}
.heading{text-align:center;font-size:clamp(24px,3vw,36px);letter-spacing:.05em;color:#503a50;margin:3px 0}
.kicker{font-size:12px;margin:0 0 15px}
.flourish{text-align:center;color:#80617f;font-size:21px;letter-spacing:.45em;margin:7px 0 13px}
.copy{font-size:clamp(14px,1.52vw,18px);line-height:1.5;color:#493b40;margin:0 auto;max-width:93%;text-align:justify}
.copy strong{color:#684c6d}
.note{margin:15px auto 0;padding:10px 13px;max-width:91%;border-left:2px solid #927395;background:rgba(119,87,120,.08);font-size:clamp(13px,1.35vw,16px);line-height:1.4;color:#5a4657}
.sigils{display:flex;justify-content:space-evenly;align-items:center;margin:15px auto 0;color:#765c79;font-size:clamp(20px,2.7vw,31px);max-width:85%}
.page-number{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.18em;color:#8a735e}
.sketch{position:relative;z-index:1;width:74%;height:auto;display:block;margin:10px auto 0;opacity:.78}
.annotation{position:absolute;z-index:2;font-size:clamp(11px,1.2vw,14px);color:#775b68;font-style:italic;transform:rotate(-7deg)}
.annotation.a{left:12%;bottom:19%}.annotation.b{right:10%;top:23%;transform:rotate(7deg)}
/* Page-turn leaf: a real 3D rotating sheet with a front and reverse */
.turn-leaf{position:absolute;z-index:6;top:0;bottom:0;left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;pointer-events:none}
.turn-leaf.turning{animation:turnForward 950ms cubic-bezier(.62,.02,.35,1) forwards}
.turn-leaf.backwards{left:0;transform-origin:right center;animation:turnBack 950ms cubic-bezier(.62,.02,.35,1) forwards}
.leaf-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:2px 9px 9px 2px}
.leaf-face.back{transform:rotateY(180deg);border-radius:9px 2px 2px 9px}
@keyframes turnForward{0%{transform:rotateY(0)}45%{box-shadow:0 12px 28px rgba(0,0,0,.3)}100%{transform:rotateY(-180deg)}}
@keyframes turnBack{0%{transform:rotateY(0)}45%{box-shadow:0 12px 28px rgba(0,0,0,.3)}100%{transform:rotateY(180deg)}}
.controls{position:absolute;left:50%;bottom:-61px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;color:#e8d8ef;font-size:14px;letter-spacing:.08em;white-space:nowrap}
.controls button{font:700 15px 'Dosis',sans-serif;color:#eee2f0;background:linear-gradient(180deg,#5d4267,#33243d);border:1px solid #9a7aa1;border-radius:24px;padding:9px 19px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s,opacity .15s}
.controls button:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(180deg,#765783,#44304e)}
.controls button:disabled{opacity:.35;cursor:default}
.counter{min-width:90px;text-align:center;color:#d8c5dc}
.hint{position:absolute;bottom:-91px;left:0;right:0;text-align:center;color:#a997b1;font-size:12px;letter-spacing:.06em}
@media(max-width:650px){.stage{width:98vw;height:84vh}.book{min-height:330px;height:68vw}.page{padding:8% 6%}.copy{line-height:1.32}.note{margin-top:8px;padding:7px}.seal{margin:12px auto}.controls{bottom:-55px;gap:8px}.controls button{padding:7px 12px}.hint{bottom:-82px}}

.stage{position:relative}.book{transition:transform 1.5s ease,opacity .8s;transform-style:preserve-3d}.stage.shut .book{transform:translateX(-25%) rotateY(-5deg);}.stage.shut .left,.stage.shut .spine{visibility:hidden}.stage.shut .cover,.stage.shut .book:before{visibility:hidden}.stage.shut .controls,.stage.shut .hint,.stage.shut #closeBook{visibility:hidden}.stage.shut .right{border-radius:8px 16px 16px 8px}.front-cover{position:absolute;top:-2%;bottom:-2%;left:50%;width:51%;z-index:20;transform-origin:left center;transform:rotateY(-180deg);transition:transform 1.5s cubic-bezier(.35,.05,.2,1);backface-visibility:hidden;border-radius:8px 18px 18px 8px;border:5px double #9c8a9e;background:radial-gradient(ellipse at center,#4c304e,transparent 65%),repeating-linear-gradient(113deg,#ffffff05 0 1px,transparent 1px 5px),#211923;box-shadow:inset 0 0 35px #000,0 8px 20px #0008;color:#d9c9db;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;cursor:pointer;font-family:Dosis,sans-serif}.stage.shut .front-cover{transform:rotateY(0)}.front-cover:before{content:'';position:absolute;inset:5%;border:3px double #a795a7;border-radius:8px;pointer-events:none}.corner{position:absolute;font-size:clamp(22px,4vw,50px);color:#b8a9bd}.tl{top:5%;left:5%}.tr{top:5%;right:5%;transform:rotate(90deg)}.bl{bottom:5%;left:5%;transform:rotate(-90deg)}.br{bottom:5%;right:5%;transform:rotate(180deg)}.cover-title{font-size:clamp(18px,3.7vw,50px);text-align:center;letter-spacing:.08em;text-shadow:0 2px #000}.cover-sub{font-size:clamp(11px,1.5vw,20px);text-align:center;max-width:80%}.moon-emblem{width:45%;max-height:38%;filter:drop-shadow(0 0 12px #ac72cb88)}.cover-prompt{font-size:clamp(11px,1.3vw,17px);letter-spacing:.12em;color:#c5a8d1}.close-book{position:absolute;right:0;bottom:-61px;border:1px solid #9a7aa1;border-radius:20px;background:#33243d;color:#eee2f0;padding:8px 14px;font:600 14px Dosis,sans-serif;cursor:pointer}.spark{position:absolute;left:50%;top:50%;color:#d7a0ff;z-index:30;pointer-events:none;animation:spark 1.5s ease-out forwards}@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.1)}}.stage.shut .front-cover:focus-visible{outline:3px solid #cba2e5}@media(max-width:850px){.close-book{bottom:auto;top:-40px}}
</style>
</head>
<body>
<div class="stage shut" id="stage">
 <main class="book" id="book" aria-label="Le Grimoire Lunaire ouvert">
  <div class="cover"></div>
  <section class="page left" id="leftPage"></section>
  <section class="page right" id="rightPage"></section>
  <div class="turn-leaf" id="turnLeaf" hidden>
    <div class="leaf-face page" id="leafFront"></div>
    <div class="leaf-face page back" id="leafBack"></div>
  </div>
  <div class="spine"></div><button class="front-cover" id="openBook" aria-label="Ouvrir le Grimoire Lunaire"><span class="corner tl">❦</span><span class="corner tr">❦</span><span class="corner bl">❦</span><span class="corner br">❦</span><span class="cover-title">Grimoire Lunaire</span><svg class="moon-emblem" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="silver"><stop stop-color="#807287"/><stop offset=".5" stop-color="#f0e4ef"/><stop offset="1" stop-color="#9d8aa5"/></linearGradient></defs><circle cx="100" cy="100" r="91" fill="none" stroke="#a995b2" stroke-dasharray="2 7"/><path d="M128 23 A80 80 0 1 0 172 148 A68 68 0 0 1 128 23Z" fill="url(#silver)" stroke="#e0d2df"/><path d="M112 65 L140 88 130 126 101 143 83 107 91 81Z" fill="#9360bc" stroke="#e0c1f5" stroke-width="2"/><path d="M112 65 L111 106 140 88 M111 106 L101 143 M111 106 L83 107 M111 106 L130 126" fill="none" stroke="#e0c1f5"/><g fill="#d8c6e4"><text x="155" y="52" font-size="22">✦</text><text x="153" y="110" font-size="15">✧</text><text x="62" y="40" font-size="14">✧</text></g></svg><span class="cover-sub">Les chroniques du Royaume du Chaos</span><span class="cover-prompt">✧ Ouvrir le grimoire ✧</span></button><button class="close-book" id="closeBook">Refermer</button>
  <div class="controls">
    <button id="prev" type="button" aria-label="Page précédente">← Précédent</button>
    <span class="counter" id="counter">1 / 3</span>
    <button id="next" type="button" aria-label="Page suivante">Suivant →</button>
  </div>
  <div class="hint">Tu peux aussi utiliser les flèches du clavier pour feuilleter</div>
 </main>
</div>
<script>
const spreads = [
[
`<span class="corner c1">✧</span><span class="corner c2">☾</span><span class="corner c3">☽</span><span class="corner c4">✧</span>
<div class="eyebrow">Livre des mystères & des merveilles</div>
<div class="seal"><div class="crescent">☾</div></div>
<h1>Grimoire<br>Lunaire</h1><p class="subtitle">Les chroniques du Royaume du Chaos</p>
<div class="rule"></div><p class="motto">« Que la lune éclaire les chemins<br>que le chaos s'amuse à brouiller. »</p>
<svg class="sketch" viewBox="0 0 300 90" fill="none" stroke="#80617f" stroke-width="1.35"><path d="M18 46 C55 12 90 12 125 45 S195 78 230 45 S270 18 284 42"/><path d="M150 15 L155 34 L175 37 L158 48 L162 68 L150 56 L137 68 L142 48 L125 37 L145 34 Z"/><circle cx="70" cy="45" r="10"/><path d="M70 30 C60 40 62 51 74 59"/><circle cx="230" cy="45" r="10"/><path d="M230 30 C220 40 222 51 234 59"/></svg><div class="page-number">— I —</div>`,
`<span class="corner c1">☽</span><span class="corner c2">✧</span><span class="corner c3">✧</span><span class="corner c4">☾</span>
<div class="eyebrow">Première entrée · À lire à la lueur des bougies</div><h2 class="heading">Bienvenue, âme égarée</h2><p class="kicker">Ici commence ton histoire</p>
<div class="flourish">— ✧ ☾ ✧ —</div>
<p class="copy">Si ces pages se sont ouvertes devant toi, c'est que le hasard — ou quelque chose de bien plus facétieux — t'a conduit jusqu'ici.<br><br>Bienvenue dans le <strong>Royaume du Chaos</strong>, un lieu où les destins se croisent, où les règles sont parfois négociables et où la magie prend des formes pour le moins… imprévisibles.<br><br>Ce grimoire conserve les histoires, les rituels, les secrets et les exploits de celles et ceux qui franchissent ses portes.</p>
<div class="note">✦ Prends garde : certaines pages sont scellées. D'autres ne devraient probablement jamais être lues à voix haute.</div>
<svg class="sketch" viewBox="0 0 300 92" fill="none" stroke="#80617f" stroke-width="1.25"><path d="M25 47 C70 5 230 5 275 47"/><circle cx="55" cy="49" r="15"/><path d="M55 34 C45 43 46 57 60 63"/><circle cx="150" cy="49" r="19"/><path d="M150 30 C130 42 133 59 150 68 C167 59 170 42 150 30Z"/><circle cx="245" cy="49" r="15"/><path d="M245 34 C255 43 254 57 240 63"/></svg><div class="annotation a">« noter ici les présages… »</div><div class="annotation b">lune croissante</div><div class="page-number">— 1 —</div>`
],
[
`<span class="corner c1">✧</span><span class="corner c2">☾</span><span class="corner c3">☽</span><span class="corner c4">✧</span>
<div class="eyebrow">Sommaire des arcanes</div><h2 class="heading" style="margin-top:18px">Les chapitres</h2><div class="flourish">— ✧ ☾ ✧ —</div>
<p class="copy"><strong>I. Le Royaume</strong><br>Les terres, les règles et les portes qui relient nos mondes.<br><br><strong>II. Les Rituels</strong><br>Les jeux, les défis et les cérémonies du chat.<br><br><strong>III. Les Archives</strong><br>Les exploits, les incidents et les légendes de nos soirées.<br><br><strong>IV. Les Pages scellées</strong><br>Les secrets que seuls les plus téméraires oseront découvrir.</p>
<div class="note">Les chapitres s'écriront au fil des aventures du Royaume.</div><div class="page-number">— 2 —</div>`,
`<span class="corner c1">☽</span><span class="corner c2">✧</span><span class="corner c3">✧</span><span class="corner c4">☾</span>
<div class="eyebrow">Note de la gardienne</div><h2 class="heading" style="margin-top:18px">Une règle essentielle</h2><div class="flourish">✦</div>
<p class="copy">Dans ce royaume, le chaos n'est jamais très loin. Un vote peut bouleverser une soirée, une roue peut condamner un innocent à un défi absurde, et un simple message peut réveiller une vieille malédiction.<br><br>Mais souviens-toi : ici, on vient pour jouer, rire et écrire ensemble les pages de cette histoire.</p>
<div class="sigils"><span>☾</span><span>✧</span><span>♜</span><span>✧</span><span>☽</span></div><div class="page-number">— 3 —</div>`
]
,
[
`<span class="corner c1">✧</span><span class="corner c2">☾</span><span class="corner c3">☽</span><span class="corner c4">✧</span>
<div class="eyebrow">Chapitre II · Rituels</div><h2 class="heading" style="margin-top:18px">Les rituels du chat</h2><div class="flourish">— ✧ ☾ ✧ —</div>
<p class="copy">Certains soirs, le grimoire s'éveille. Les voix du chat deviennent des incantations et les choix prennent le pouvoir.<br><br><strong>La Roue du Chaos</strong> désigne un défi au hasard.<br><br><strong>Le Tribunal</strong> appelle les âmes à voter et à rendre leur verdict.<br><br><strong>Les Événements imprévus</strong> surgissent sans prévenir… et personne n'est à l'abri.</p><div class="note">Ces rituels seront reliés aux commandes du chat lors d'une prochaine étape.</div><div class="page-number">— 4 —</div>`,
`<span class="corner c1">☽</span><span class="corner c2">✧</span><span class="corner c3">✧</span><span class="corner c4">☾</span>
<div class="eyebrow">À compléter au fil des lives</div><h2 class="heading" style="margin-top:18px">Les pages à venir</h2><div class="flourish">✦</div>
<p class="copy">Le Grimoire Lunaire n'est pas terminé. Il grandira avec le Royaume, ses habitués, ses nouveaux venus et toutes les histoires qui méritent d'être conservées.<br><br>Une page vierge n'est jamais vide très longtemps…</p>
<div class="sigils"><span>☾</span><span>✧</span><span>✦</span><span>✧</span><span>☽</span></div><div class="page-number">— 5 —</div>`
]
];

let index=0, busy=false;
const left=document.getElementById('leftPage'), right=document.getElementById('rightPage');
const leaf=document.getElementById('turnLeaf'), front=document.getElementById('leafFront'), back=document.getElementById('leafBack');
const prev=document.getElementById('prev'), next=document.getElementById('next'), counter=document.getElementById('counter');
function render(){left.innerHTML=spreads[index][0];right.innerHTML=spreads[index][1];counter.textContent=`${index+1} / ${spreads.length}`;prev.disabled=index===0;next.disabled=index===spreads.length-1;}
function turn(direction){
 if(document.getElementById("stage").classList.contains("shut") || coverBusy || busy || (direction>0 && index>=spreads.length-1) || (direction<0 && index<=0)) return;
 busy=true;
 if(direction>0){
   front.innerHTML=spreads[index][1]; back.innerHTML=spreads[index+1][0];
   leaf.className='turn-leaf';leaf.hidden=false;void leaf.offsetWidth;leaf.classList.add('turning');
   window.setTimeout(()=>{index++;render();leaf.hidden=true;leaf.className='turn-leaf';busy=false;},960);
 }else{
   front.innerHTML=spreads[index][0]; back.innerHTML=spreads[index-1][1];
   leaf.className='turn-leaf backwards';leaf.hidden=false;void leaf.offsetWidth;leaf.classList.add('backwards');
   window.setTimeout(()=>{index--;render();leaf.hidden=true;leaf.className='turn-leaf';busy=false;},960);
 }
}
prev.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);});
render();
const stage=document.getElementById('stage'), openBook=document.getElementById('openBook'), closeBook=document.getElementById('closeBook');
let coverBusy=false;
function toggleCover(open){if(busy||coverBusy)return;coverBusy=true;if(open){stage.classList.remove('shut');for(let i=0;i<24;i++){const p=document.createElement('span');p.className='spark';p.textContent=i%2?'✦':'·';p.style.setProperty('--x',`${Math.cos(i*2.4)*(80+i*12)}px`);p.style.setProperty('--y',`${Math.sin(i*2.4)*(80+i*9)}px`);stage.appendChild(p);setTimeout(()=>p.remove(),1600);}}else{stage.classList.add('shut');}setTimeout(()=>{coverBusy=false;openBook.tabIndex=open?-1:0;},1550);}
openBook.addEventListener('click',()=>toggleCover(true));closeBook.addEventListener('click',()=>toggleCover(false));
</script>
</body>
</html>
